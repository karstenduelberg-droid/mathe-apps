<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mathe-Apps</title>
<style>
:root{--bg:#F3F6F9;--surface:#FFFFFF;--ink:#16212E;--muted:#56626F;--line:#CDD6E1;--accent:#1F4E79}
@media (prefers-color-scheme: dark){:root{--bg:#0F151D;--surface:#17212D;--ink:#E5EBF2;--muted:#9BA8B7;--line:#2C3A4B;--accent:#86B6E4;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
h1{margin:0;color:var(--accent);font-size:1.5rem}
p{margin:0;color:var(--muted)}
a.app{display:grid;gap:4px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink);text-decoration:none}
a.app:hover,a.app:focus-visible{border-color:var(--accent)}
a.app b{color:var(--accent);font-size:1.05rem}
</style>
</head>
<body>
<main>
  <h1>Mathe-Apps</h1>
  <p>Mathematik · Franz-Stock-Gymnasium Arnsberg. Die Apps laufen im Browser und speichern nur auf dem eigenen Gerät.</p>
  <a class="app" href="legeplan-potenzfunktionen.html"><b>Legeplan Potenzfunktionen</b><span>EF · Eigenschaften von <i>x</i><sup><i>q</i></sup> ordnen, begründen und präsentieren</span></a>
</main>
</body>
</html>
